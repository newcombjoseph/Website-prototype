# Local development only. PostgreSQL is reachable only on this computer.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bonnets
      POSTGRES_USER: bonnets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in PowerShell first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - bonnet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonnets -d bonnets"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  bonnet_postgres:
