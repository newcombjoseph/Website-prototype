services:
  django:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      APP_ENV: production
    expose:
      - "8000"
    volumes:
      - ${RDS_CA_BUNDLE_PATH:?Set the absolute path to the AWS RDS CA bundle}:/run/rds/global-bundle.pem:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Use an existing authorized HTTPS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - django
volumes:
  caddy_data:
  caddy_config:
