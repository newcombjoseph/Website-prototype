{% load static %}<article class="product-card" data-category="{{ product.category }}" data-name="{{ product.name|lower }}" data-price="{{ product.price }}">
  <div class="product-visual"><a href="/products/{{ product.slug }}/" tabindex="-1" aria-hidden="true"><img src="{{ product.image_url }}" alt="{{ product.color }} {{ product.name }}" loading="lazy" width="600" height="600"></a><span class="product-tag">{{ product.badge }}</span><a class="quick-add" href="/products/{{ product.slug }}/" aria-label="Choose size and style for {{ product.name }}">Choose options <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></a></div>
  <div class="product-meta"><div><h3><a href="/products/{{ product.slug }}/">{{ product.name }}</a></h3><p>{{ product.color }}</p></div><span>{{ product.price_display }}</span></div>
</article>
