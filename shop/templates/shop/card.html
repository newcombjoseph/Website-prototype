{% load static %}<article class="product-card" data-category="{{ product.category }}" data-name="{{ product.name|lower }}" data-price="{{ product.price }}">
  <div class="product-visual"><a href="/products/{{ product.slug }}/" tabindex="-1" aria-hidden="true"><img src="{% static 'shop/images/' %}{{ product.image }}" alt="{{ product.color }} {{ product.name }}" loading="lazy" width="600" height="600"></a><span class="product-tag">{{ product.badge }}</span><form class="quick-add cart-add" action="/cart/add/" method="post">{% csrf_token %}<input type="hidden" name="product_id" value="{{ product.id }}"><input type="hidden" name="quantity" value="1"><button aria-label="Add {{ product.name }} to bag" title="Add to bag">+</button></form></div>
  <div class="product-meta"><div><h3><a href="/products/{{ product.slug }}/">{{ product.name }}</a></h3><p>{{ product.color }}</p></div><span>{{ product.price_display }}</span></div>
</article>
